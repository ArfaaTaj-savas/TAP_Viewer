<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">TAP Viewer logo</title>
  <desc id="desc">Golden magnifying glass over a green drilling pattern</desc>
  <defs>
    <radialGradient id="bg" cx="48%" cy="42%" r="70%">
      <stop offset="0" stop-color="#164b34"/>
      <stop offset="1" stop-color="#001812"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff36a"/>
      <stop offset=".45" stop-color="#ffd21c"/>
      <stop offset="1" stop-color="#f39800"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff16a"/>
      <stop offset=".6" stop-color="#ffc51a"/>
      <stop offset="1" stop-color="#f38a00"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="256" height="256" rx="38" fill="url(#bg)"/>
  <circle cx="127" cy="120" r="82" fill="#0b3728" opacity=".8" filter="url(#soft)"/>
  <g fill="#c89518" opacity=".95">
    <circle cx="86" cy="63" r="5"/><circle cx="105" cy="59" r="5"/><circle cx="126" cy="58" r="5"/><circle cx="147" cy="61" r="5"/>
    <circle cx="74" cy="80" r="5"/><circle cx="169" cy="80" r="5"/><circle cx="64" cy="99" r="5"/><circle cx="180" cy="99" r="5"/>
    <circle cx="57" cy="120" r="5"/><circle cx="187" cy="120" r="5"/><circle cx="64" cy="141" r="5"/><circle cx="180" cy="141" r="5"/>
    <circle cx="74" cy="161" r="5"/><circle cx="169" cy="161" r="5"/><circle cx="86" cy="178" r="5"/><circle cx="105" cy="183" r="5"/><circle cx="126" cy="184" r="5"/><circle cx="147" cy="181" r="5"/>
  </g>
  <g fill="#12d99b" filter="url(#glow)">
    <circle cx="95" cy="79" r="7"/><circle cx="115" cy="79" r="7"/><circle cx="135" cy="79" r="7"/>
    <circle cx="84" cy="99" r="7"/><circle cx="159" cy="99" r="7"/><circle cx="74" cy="120" r="7"/><circle cx="169" cy="120" r="7"/>
    <circle cx="84" cy="141" r="7"/><circle cx="159" cy="141" r="7"/><circle cx="95" cy="162" r="7"/><circle cx="115" cy="162" r="7"/><circle cx="135" cy="162" r="7"/>
  </g>
  <g fill="#fff">
    <circle cx="105" cy="99" r="7"/><circle cx="136" cy="99" r="7"/><circle cx="95" cy="120" r="7"/><circle cx="136" cy="120" r="7"/><circle cx="105" cy="141" r="7"/><circle cx="136" cy="141" r="7"/>
  </g>
  <circle cx="119" cy="120" r="7" fill="#ffd21c" filter="url(#glow)"/>
  <circle cx="127" cy="119" r="76" fill="none" stroke="url(#gold)" stroke-width="9" filter="url(#glow)"/>
  <path d="M183 177l38 38c5 5 5 12 0 17s-12 5-17 0l-38-38z" fill="url(#handle)" stroke="#f39800" stroke-width="2"/>
</svg>
